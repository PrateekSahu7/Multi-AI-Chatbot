<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multi-AI Agent Chat</title>
<style>
:root{--bg:#e8ecef;--ink:#15202b;--muted:#5b6b7a;--line:#cfd8df;--panel:#fff;--accent:#0f5c63;--err:#b42318;--errbg:#fdecea}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.5 "Segoe UI","Avenir Next",system-ui,sans-serif;color:var(--ink);background:var(--bg);display:grid;grid-template-columns:260px 1fr;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

aside{background:#dfe5ea;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
aside h1{font-size:16px;margin:0;padding:16px 16px 8px}
.btn{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:8px 14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
#newSession{margin:0 16px 12px}
#sessions{list-style:none;margin:0;padding:0 8px;overflow:auto;flex:1}
#sessions li{display:flex;align-items:center;border-radius:6px}
#sessions li.active{background:#fff}
#sessions .open{flex:1;text-align:left;background:none;border:0;padding:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sessions .del{background:none;border:0;color:var(--muted);padding:6px 10px;font-size:18px;line-height:1}
#sessions .del:hover{color:var(--err)}
details{margin:8px 16px 16px;font-size:14px}
summary{cursor:pointer;color:var(--accent)}
details form{display:grid;gap:6px;margin-top:8px}
details input,details select{padding:6px;border:1px solid var(--line);border-radius:6px;background:#fff}

p.hint{color:var(--muted);font-size:12px;margin:8px 0 0}
ul.keys{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:4px}
ul.keys li{display:flex;justify-content:space-between;align-items:center}
ul.keys button{background:none;border:0;color:var(--err);padding:2px 4px}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
.agents{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);align-items:center}
.agents .label{color:var(--muted);margin-right:4px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;display:flex;gap:6px;align-items:center}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.chip[aria-pressed=true]{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
.chip small{color:var(--muted)}
#panels{flex:1;min-height:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(280px,1fr);gap:12px;padding:12px 16px;overflow-x:auto}
.panel{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:6px;display:flex;flex-direction:column;min-height:0}
.panel header{padding:10px 14px;border-bottom:1px solid var(--line)}
.panel header b{display:block}
.panel header span{color:var(--muted);font-size:13px}
.body{flex:1;overflow-y:auto;padding:10px 14px}
.turn{margin-bottom:16px}
.you{color:var(--muted);font-size:13px;margin-bottom:4px;white-space:pre-wrap}
.answer{white-space:pre-wrap;overflow-wrap:anywhere}
.meta{color:var(--muted);font-size:12px;margin-top:4px}
.working{color:var(--muted)}
.working::after{content:"";display:inline-block;width:.8em;animation:dots 1.2s steps(4) infinite;overflow:hidden;vertical-align:bottom}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.fail{background:var(--errbg);color:var(--err);border-radius:6px;padding:8px 10px}
.fail .btn{margin-top:6px;padding:4px 10px}
.skipped{color:var(--muted);font-style:italic}
.empty{margin:auto;color:var(--muted);text-align:center;padding:24px}
footer{border-top:1px solid var(--line);background:#dfe5ea;padding:12px 16px;display:grid;gap:6px}
footer .row{display:flex;gap:10px;align-items:flex-end}
textarea{flex:1;resize:vertical;min-height:52px;max-height:200px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#fff}
#msg{min-height:20px;font-size:13px;color:var(--err)}
#msg.info{color:var(--muted)}
@media (max-width:760px){
  body{grid-template-columns:1fr;grid-template-rows:auto 1fr;overflow:auto}
  aside{max-height:30vh}
  #panels{grid-auto-flow:row;grid-auto-columns:auto;overflow-x:visible}
  .panel{min-height:240px}
}
@media (prefers-reduced-motion:reduce){.working::after{animation:none;content:"..."}}
</style>
</head>
<body>
<aside>
  <h1>Multi-AI Agent Chat</h1>
  <button class="btn" id="newSession">New session</button>
  <ul id="sessions" aria-label="Session history"></ul>
  <details id="keysBox" open>
    <summary>Your API keys</summary>
    <form id="keyForm">
      <select name="provider"><option value="groq">Groq</option><option value="gemini">Gemini</option><option value="openai">OpenAI</option><option value="anthropic">Claude</option></select>
      <input name="key" type="password" placeholder="Paste your API key" autocomplete="off" required>
      <button class="btn ghost" type="submit">Save key</button>
    </form>
    <ul id="keyList" class="keys"></ul>
    <p class="hint">Keys stay in this browser. They are sent to the server only with your prompts and are never stored there.</p>
  </details>
  <details>
    <summary>Add agent</summary>
    <form id="addAgent">
      <select name="provider" id="provSel">
        <option value="openai">OpenAI (GPT)</option>
        <option value="anthropic">Anthropic (Claude)</option>
        <option value="gemini">Google (Gemini)</option>
        <option value="groq">Groq</option>
        <option value="custom">Other (OpenAI-compatible)</option>
        <option value="mock">Mock (testing)</option>
      </select>
      <input name="name" placeholder="Name, e.g. Llama on Groq" required>
      <input name="model" placeholder="Model id" required>
      <input name="base_url" id="baseUrl" placeholder="Base URL, e.g. https://api.groq.com/openai/v1" hidden>
      <input name="api_key" type="password" placeholder="API key (optional for mock)" autocomplete="off">
      <button class="btn ghost" type="submit">Add agent</button>
    </form>
    <ul id="agentList" class="keys"></ul>
  </details>
</aside>
<main>
  <div class="agents" id="agents" role="group" aria-label="Choose agents"></div>
  <div id="panels"></div>
  <footer>
    <div id="msg" role="status"></div>
    <div class="row">
      <textarea id="prompt" placeholder="Write one prompt for every selected agent. Ctrl+Enter sends." aria-label="Prompt"></textarea>
      <button class="btn" id="send">Send</button>
    </div>
  </footer>
</main>

<script>
const COLORS = ["#0f766e","#b45309","#6d28d9","#be123c","#1d4ed8","#4d7c0f","#a21caf"];
const S = { cfg: { require_user_keys: false }, agents: [], selected: new Set(), sessions: [], current: null, pending: {}, ws: null };
const $ = id => document.getElementById(id);
const color = a => COLORS[(a.id - 1) % COLORS.length];

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function note(text, info) { const m = $("msg"); m.textContent = text || ""; m.className = info ? "info" : ""; }

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) {
    let detail = "Request failed.";
    try { detail = (await r.json()).detail || detail; } catch (_) {}
    throw new Error(detail);
  }
  return r.status === 204 ? null : r.json();
}
const post = (path, body) => api(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });

/* ---------- agents ---------- */
async function loadAgents() {
  S.agents = await api("/api/agents");
  if (!S.selected.size) S.agents.slice(0, 2).forEach(a => S.selected.add(a.id));
  renderAgents(); render();
}
function renderAgents() {
  const box = $("agents");
  box.replaceChildren(el("span", "label", "Send to:"));
  for (const a of S.agents) {
    const b = el("button", "chip");
    b.style.setProperty("--c", color(a));
    b.setAttribute("aria-pressed", S.selected.has(a.id));
    b.append(el("i"), el("span", "", a.name), el("small", "", a.model));
    if (!hasKey(a)) { b.append(el("small", "", "no key")); b.title = "Add your API key in the sidebar to use this agent."; }
    b.onclick = () => { S.selected.has(a.id) ? S.selected.delete(a.id) : S.selected.add(a.id); renderAgents(); render(); updateSend(); };
    box.append(b);
  }
  renderManage();
}
function updateSend() {
  const n = S.selected.size;
  $("send").textContent = n ? `Send to ${n} agent${n > 1 ? "s" : ""}` : "Send";
}
$("addAgent").onsubmit = async e => {
  e.preventDefault();
  const f = new FormData(e.target);
  try {
    const a = await post("/api/agents", { name: f.get("name"), model: f.get("model"), provider: f.get("provider"),
      base_url: f.get("base_url"), api_key: f.get("api_key") });
    S.selected.add(a.id); e.target.reset(); await loadAgents(); updateSend(); note(`Added ${a.name}.`, true);
  } catch (err) { note(err.message); }
};

$("provSel").onchange = e => { $("baseUrl").hidden = e.target.value !== "custom"; $("baseUrl").required = e.target.value === "custom"; };
function renderManage() {
  const ul = $("agentList");
  ul.replaceChildren();
  for (const a of S.agents) {
    const li = el("li", "", a.name);
    const b = el("button", "", "Remove");
    b.onclick = async () => {
      if (!confirm(`Remove agent "${a.name}"? Its saved key is deleted; old answers stay in history.`)) return;
      try { await api(`/api/agents/${a.id}`, { method: "DELETE" }); S.selected.delete(a.id); await loadAgents(); updateSend(); }
      catch (err) { note(err.message); }
    };
    li.append(b); ul.append(li);
  }
}

/* ---------- api keys: kept in this browser only ---------- */
const PROVIDER_NAMES = { groq: "Groq", gemini: "Gemini", openai: "OpenAI", anthropic: "Claude" };
function localKeys() { try { return JSON.parse(localStorage.getItem("mai_keys") || "{}"); } catch (_) { return {}; } }
function storeKeys(k) { try { localStorage.setItem("mai_keys", JSON.stringify(k)); return true; } catch (_) { return false; } }
function hasKey(a) {
  if (a.provider === "mock" || a.provider === "custom") return a.configured;
  return !!localKeys()[a.provider] || (!S.cfg.require_user_keys && a.configured);
}
function loadKeys() {
  const keys = localKeys(), ul = $("keyList");
  ul.replaceChildren();
  for (const [p, name] of Object.entries(PROVIDER_NAMES)) {
    const li = el("li", "", `${name}: ${keys[p] ? "saved in this browser" : "no key"}`);
    if (keys[p]) {
      const b = el("button", "", "Remove");
      b.onclick = () => { const k = localKeys(); delete k[p]; storeKeys(k); loadKeys(); renderAgents(); };
      li.append(b);
    }
    ul.append(li);
  }
}
$("keyForm").onsubmit = e => {
  e.preventDefault();
  const f = new FormData(e.target), key = String(f.get("key")).trim();
  if (!key || /\s/.test(key) || key.length > 500) return note("That does not look like an API key.");
  const k = localKeys(); k[f.get("provider")] = key;
  if (!storeKeys(k)) return note("This browser blocked saving the key (private mode?).");
  e.target.reset(); loadKeys(); renderAgents();
  note("Key saved in this browser.", true);
};

/* ---------- sessions ---------- */
async function loadSessions() {
  S.sessions = await api("/api/sessions");
  renderSessions();
}
function renderSessions() {
  const ul = $("sessions");
  ul.replaceChildren();
  for (const s of S.sessions) {
    const li = el("li", S.current && S.current.id === s.id ? "active" : "");
    const open = el("button", "open", s.title);
    open.onclick = () => openSession(s.id);
    const del = el("button", "del", "\u00d7");
    del.setAttribute("aria-label", `Delete session ${s.title}`);
    del.onclick = () => removeSession(s);
    li.append(open, del);
    ul.append(li);
  }
}
async function newSession() {
  const s = await post("/api/sessions");
  await loadSessions();
  await openSession(s.id);
}
async function removeSession(s) {
  if (!confirm(`Delete "${s.title}"? This cannot be undone.`)) return;
  await api(`/api/sessions/${s.id}`, { method: "DELETE" });
  const wasCurrent = S.current && S.current.id === s.id;
  await loadSessions();
  if (wasCurrent) S.sessions.length ? openSession(S.sessions[0].id) : newSession();
}
async function openSession(id) {
  S.current = await api(`/api/sessions/${id}`);
  S.pending = {};
  note("");
  connect(id); renderSessions(); render();
}

/* ---------- websocket ---------- */
async function recover() {
  S.current = null; S.pending = {};
  await loadSessions();
  S.sessions.length ? await openSession(S.sessions[0].id) : await newSession();
  note("That session was gone (a free host resets its storage when it restarts). Opened a fresh one.", true);
}
function connect(id, attempt = 0) {
  if (S.ws) { S.ws.onclose = null; S.ws.close(); }
  const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws/sessions/${id}`);
  S.ws = ws;
  ws.onmessage = e => onEvent(JSON.parse(e.data));
  ws.onclose = async e => {
    if (S.ws !== ws || !S.current || S.current.id !== id) return;
    let gone = e.code === 4404;
    if (!gone) {
      try { gone = (await fetch(`/api/sessions/${id}`)).status === 404; } catch (_) {}
    }
    if (gone) return recover();
    note("Connection lost. Reconnecting...", true);
    setTimeout(() => { if (S.ws === ws && S.current && S.current.id === id) connect(id, attempt + 1); },
               Math.min(1500 * (attempt + 1), 10000));
  };
  ws.onopen = () => { attempt = 0; if ($("msg").textContent.startsWith("Connection lost")) note(""); };
}
function onEvent(ev) {
  const msgs = S.current.messages, key = `${ev.parent_id}:${ev.agent_id}`;
  if (ev.type === "prompt_saved") {
    msgs.push(ev.message);
    const s = S.sessions.find(x => x.id === S.current.id);
    if (s) { s.title = ev.title; renderSessions(); }
    $("prompt").value = ""; note("");
  } else if (ev.type === "status") {
    S.current.messages = msgs.filter(m => !(m.parent_id === ev.parent_id && m.agent_id === ev.agent_id));
    S.pending[key] = true;
  } else if (ev.type === "result") {
    delete S.pending[key];
    msgs.push({ id: ev.message_id, parent_id: ev.parent_id, agent_id: ev.agent_id, role: "assistant",
                content: ev.content, status: ev.status, error_kind: ev.error_kind, latency_ms: ev.latency_ms });
  } else if (ev.type === "error") {
    note(ev.message);
  }
  render();
}
function transmit(payload) {
  if (!S.ws || S.ws.readyState !== 1) { note("Not connected yet. Try again in a moment."); return false; }
  S.ws.send(JSON.stringify({ type: "prompt", keys: localKeys(), ...payload }));
  return true;
}
function submit() {
  const text = $("prompt").value.trim();
  if (!S.selected.size) return note("Select at least one agent.");
  if (!text) return note("Write a prompt first.");
  note("");
  transmit({ prompt: text, agent_ids: [...S.selected] });
}
function retry(agentId) { transmit({ retry: true, agent_ids: [agentId] }); }

/* ---------- rendering ---------- */
function render() {
  const box = $("panels");
  const keep = {};
  box.querySelectorAll(".panel").forEach(p => {
    const b = p.querySelector(".body");
    keep[p.dataset.id] = { top: b.scrollTop, bottom: b.scrollHeight - b.scrollTop - b.clientHeight < 40 };
  });
  box.replaceChildren();
  const agents = S.agents.filter(a => S.selected.has(a.id));
  if (!agents.length) { box.append(el("div", "empty", "Select at least one agent above to see its panel.")); return; }
  const msgs = S.current ? S.current.messages : [];
  const prompts = msgs.filter(m => m.role === "user");
  const lastPrompt = prompts.length ? prompts[prompts.length - 1].id : null;

  for (const a of agents) {
    const p = el("section", "panel");
    p.dataset.id = a.id; p.style.setProperty("--c", color(a));
    const h = el("header"); h.append(el("b", "", a.name), el("span", "", `${a.model} \u2022 ${a.provider}`));
    const body = el("div", "body");
    if (!prompts.length) body.append(el("div", "empty", "Send a prompt to compare answers here."));
    for (const u of prompts) {
      const t = el("div", "turn");
      t.append(el("div", "you", u.content));
      const r = msgs.find(m => m.parent_id === u.id && m.agent_id === a.id);
      if (S.pending[`${u.id}:${a.id}`]) t.append(el("div", "working", "Working"));
      else if (!r) t.append(el("div", "skipped", "This agent was not asked this prompt."));
      else if (r.status === "error") {
        const f = el("div", "fail", r.content);
        if (u.id === lastPrompt) { const b = el("button", "btn", "Retry this agent"); b.onclick = () => retry(a.id); f.append(el("br"), b); }
        t.append(f);
      } else {
        t.append(el("div", "answer", r.content));
        if (r.latency_ms != null) t.append(el("div", "meta", `${(r.latency_ms / 1000).toFixed(1)} s`));
      }
      body.append(t);
    }
    p.append(h, body); box.append(p);
    const k = keep[a.id];
    body.scrollTop = !k || k.bottom ? body.scrollHeight : k.top;
  }
}

/* ---------- start ---------- */
$("newSession").onclick = newSession;
$("send").onclick = submit;
$("prompt").addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); submit(); } });
(async () => {
  try {
    try { S.cfg = await api("/api/config"); } catch (_) {}
    await loadAgents(); updateSend(); loadKeys();
    await loadSessions();
    S.sessions.length ? await openSession(S.sessions[0].id) : await newSession();
  } catch (err) { note("Could not load the app: " + err.message); }
})();
</script>
</body>
</html>
